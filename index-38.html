<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3ECE0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1D1612" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="릴스 메이커">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>새로운뷰티 릴스 메이커</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bodoni+Moda:ital,wght@0,700;1,700&family=Gaegu:wght@700&family=IBM+Plex+Mono:wght@500;700&family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@500;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
.app{grid-template-columns:minmax(0,1fr)}
/* Layout: phone-first editor — 9:16 preview on top, style picker, scene strip, scene editor, sticky export bar. Two columns on wide screens. */
:root{
  --bg:#F3ECE0; --paper:#FBF7F0; --fg:#3E2C20; --muted:#8A7564;
  --wood:#4A3426; --sage:#8FA37E; --sage-soft:#E3E9DA; --apricot:#E2874F; --apricot-soft:#F7DDCB;
  --line:rgba(74,52,38,.14); --warn:#C0562B;
  --ui:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1D1612; --paper:#2A201A; --fg:#F1E6D6; --muted:#B19C88;
  --wood:#F1E6D6; --sage:#A9BC97; --sage-soft:#2F3529; --apricot:#EE9A63; --apricot-soft:#3D2A1F;
  --line:rgba(241,230,214,.14); --warn:#F08A5D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1D1612; --paper:#2A201A; --fg:#F1E6D6; --muted:#B19C88;
  --wood:#F1E6D6; --sage:#A9BC97; --sage-soft:#2F3529; --apricot:#EE9A63; --apricot-soft:#3D2A1F;
  --line:rgba(241,230,214,.14); --warn:#F08A5D; color-scheme:dark}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--ui);font-size:15px;line-height:1.5;padding:0 16px;padding-block:12px 110px}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
.app{max-width:1040px;margin:0 auto;display:grid;gap:18px}
@media (min-width:860px){.app{grid-template-columns:400px minmax(0,1fr);align-items:start}.left{position:sticky;top:12px}}
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
h1{font-size:19px;font-weight:900;letter-spacing:-.02em;margin:0;text-wrap:balance}
h1 span{color:var(--apricot)}
.spec{font-size:12px;color:var(--muted);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.left{display:grid;gap:10px;min-width:0}
.stage{display:flex;justify-content:center}
canvas#cv{height:min(58vh,640px);aspect-ratio:9/16;max-width:100%;border-radius:14px;background:#2a211b;box-shadow:0 10px 30px rgba(40,26,16,.18);display:block}
canvas#cv.drag{touch-action:none;cursor:grab}
.transport{display:flex;align-items:center;gap:10px}
.play{width:44px;height:44px;border-radius:50%;border:0;background:var(--wood);color:var(--bg);font-size:16px;cursor:pointer;flex:none}
#scrub{flex:1;min-width:0;accent-color:var(--apricot)}
.time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;width:72px;text-align:right}
.right{display:grid;gap:16px;min-width:0}
.label{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:8px}
.select-wrap{position:relative}
.select-wrap::after{content:"";position:absolute;right:16px;top:50%;width:9px;height:9px;border-right:2px solid var(--fg);border-bottom:2px solid var(--fg);transform:translateY(-70%) rotate(45deg);pointer-events:none}
#styleSel{width:100%;appearance:none;-webkit-appearance:none;border:1.5px solid var(--apricot);background:var(--apricot-soft);color:var(--fg);border-radius:12px;padding:13px 44px 13px 14px;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
.sty{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 8px 7px;text-align:left;cursor:pointer;display:grid;gap:1px;min-width:0}
.sty .no{font-size:10.5px;font-weight:900;color:var(--apricot);font-variant-numeric:tabular-nums}
.sty b{font-size:12.5px;line-height:1.25;word-break:keep-all}
.sty small{font-size:10px;color:var(--muted);line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sty.on{border-color:var(--apricot);background:var(--apricot-soft)}
.sty-detail{display:grid;gap:6px}
.sty-detail h2{margin:0;font-size:16px;font-weight:900;letter-spacing:-.01em}
.sty-detail h2 small{font-size:12px;font-weight:500;color:var(--muted);margin-left:6px}
.sty-detail p{margin:0;font-size:13.5px}
.sty-detail .ex{font-size:12.5px;color:var(--muted)}
.meta{display:flex;gap:6px;flex-wrap:wrap}
.meta span{font-size:11.5px;background:var(--sage-soft);border-radius:999px;padding:2px 9px;font-weight:700}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;width:84px;height:120px;border-radius:10px;border:2px solid transparent;background:var(--paper);position:relative;overflow:hidden;cursor:pointer;padding:0;text-align:left}
.chip.on{border-color:var(--apricot)}
.chip img,.chip .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.chip .ph{background:linear-gradient(160deg,var(--sage-soft),var(--apricot-soft))}
.chip .cap{position:absolute;left:0;right:0;bottom:0;padding:5px 6px;font-size:11px;line-height:1.25;color:#FFF8EE;background:linear-gradient(transparent,rgba(30,20,14,.78));font-weight:700}
.chip .n{position:absolute;top:5px;left:6px;font-size:11px;font-weight:900;color:#FFF8EE;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.chip .tag{position:absolute;top:5px;right:5px;font-size:10px;background:rgba(30,20,14,.6);color:#FFF8EE;border-radius:6px;padding:0 5px}
.chip.add{border:2px dashed var(--line);background:transparent;display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center}
.total{font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:0;text-transform:none;font-size:12px}
.total.off{color:var(--warn)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;cursor:pointer;font-size:14px;font-weight:500}
.btn:hover{border-color:var(--sage)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.accent{background:var(--sage-soft);border-color:transparent}
.btn.danger{color:var(--warn)}
.btn:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--apricot);outline-offset:2px}
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:700}
.field .hint{font-size:12px;color:var(--muted)}
textarea,input[type=text]{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;resize:vertical;font-size:16px}
textarea{min-height:76px;font-weight:700}
.dur{display:flex;align-items:center;gap:8px}
.dur output{min-width:58px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.media-name{font-size:13px;color:var(--muted);overflow-wrap:anywhere;min-width:0}
.blurbox{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:10px}
.blurbox input[type=range]{width:100%;accent-color:var(--sage)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-size:13px}
.seg button.on{background:var(--wood);color:var(--bg)}
.hooks{display:flex;gap:6px;flex-wrap:wrap}
.hook-box{display:grid;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.hook-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.hook-tabs::-webkit-scrollbar{display:none}
.hook-tabs button{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:700;cursor:pointer;min-height:32px}
.hook-tabs button.on{background:var(--wood);color:var(--bg);border-color:transparent}
.hooks button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer}
.hooks button:hover{background:var(--apricot-soft)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:5}
.bar-in{max-width:1040px;margin:0 auto;display:flex;gap:10px;align-items:center}
.export{flex:1;border:0;border-radius:12px;padding:14px;background:var(--apricot);color:#2B1A10;font-weight:900;font-size:16px;cursor:pointer;position:relative;overflow:hidden}
.export .fill{position:absolute;inset:0 auto 0 0;background:rgba(255,255,255,.35);width:0}
.export span{position:relative}
.export:disabled{cursor:progress}
.result{display:grid;gap:10px}
.result video{width:160px;aspect-ratio:9/16;border-radius:10px;background:#000}
.note{font-size:12.5px;color:var(--muted)}
.filebtn{position:relative;overflow:hidden;display:inline-flex;align-items:center}
.filebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:40px}
.filebtn:focus-within{outline:2px solid var(--apricot);outline-offset:2px}
.sr-file{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0}
.panel,.right,.left{grid-template-columns:minmax(0,1fr)}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;min-height:40px}
.toggle input{width:20px;height:20px;accent-color:var(--apricot)}
.btn{min-height:40px}.btn.sm{min-height:34px}
.install{display:grid;gap:8px;background:var(--sage-soft);border-radius:14px;padding:14px 16px}
.install b{font-size:14px}
.install .row{justify-content:space-between}
@media (max-width:859px){
  body{padding-block:0 120px;overscroll-behavior-y:contain}
  .app{gap:14px}
  .left{position:sticky;top:0;z-index:4;background:var(--bg);margin:0 -16px;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 10px;border-bottom:1px solid var(--line);gap:8px}
  header{align-items:center}
  h1{font-size:16px}
  .spec{font-size:11px}
  canvas#cv{height:min(38dvh,340px);height:min(38vh,340px);border-radius:12px}
  @supports (height:1dvh){canvas#cv{height:min(38dvh,340px)}}
  .play{width:40px;height:40px}
  .panel{padding:14px;border-radius:12px}
  .chip{width:76px;height:108px}
  .export{padding:15px;font-size:16px}
}
@media (display-mode:standalone){.install{display:none!important}}
.ai{border:1px solid color-mix(in srgb,var(--apricot) 40%,transparent);background:var(--apricot-soft);border-radius:12px;padding:12px;display:grid;gap:10px}
.ai-btn{border:0;background:var(--wood);color:var(--bg);border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;font-size:14px}
.ai-btn:disabled{opacity:.5;cursor:progress}
.sugs{display:grid;gap:8px}
.sug{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;cursor:pointer;display:grid;gap:2px}
.sug:hover{border-color:var(--apricot)}
.sug b{font-size:15px;white-space:pre-line;line-height:1.35}
.sug b em{font-style:normal;color:var(--apricot)}
.sug span{font-size:12.5px;color:var(--muted)}
.sug small{font-size:11.5px;color:var(--muted);opacity:.85}
.plan-list{display:grid;gap:6px;margin:0;padding-left:20px}
.plan-list li{font-size:13.5px}
.plan-list li b{white-space:pre-line}
.plan-list li b em{font-style:normal;color:var(--apricot)}
.thinking{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--apricot);animation:pulse 1s infinite alternate}
@keyframes pulse{to{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
</style>

</head>
<body>
<div class="app">
  <div class="left">
    <header>
      <h1>새로운뷰티 <span>릴스</span> 메이커</h1>
      <div class="spec" id="spec">9:16 · 애플 키네틱</div>
    </header>
    <div class="stage"><canvas id="cv" width="720" height="1280" aria-label="릴스 미리보기"></canvas></div>
    <div class="transport">
      <button class="play" id="playBtn" aria-label="재생">▶</button>
      <input type="range" id="scrub" min="0" max="15" step="0.01" value="0" aria-label="재생 위치">
      <div class="time" id="time">0.0 / 15.0s</div>
    </div>
  </div>

  <div class="right">
    <div class="install" id="install" hidden>
      <b>홈 화면에 설치하면 앱처럼 써요</b>
      <div class="note" id="installHow"></div>
      <div class="row"><button class="btn accent" id="installBtn" hidden>앱 설치</button><button class="btn sm" id="installClose">닫기</button></div>
    </div>

    <div class="panel">
      <div class="label"><span>영상 스타일</span></div>
      <div class="pick-row">
        <div class="select-wrap"><select id="styleSel" aria-label="영상 스타일 선택"></select></div>
      </div>
      <div class="field">
        <label>글씨체</label>
        <div class="seg" role="group" aria-label="글씨체" id="fontSeg"><button data-f="unified">잘 보이게 통일</button><button data-f="style">스타일별 개성</button></div>
      </div>
      <div class="sty-detail" id="styDetail"></div>
    </div>

    <div>
      <div class="label"><span>장면 순서</span><span class="total" id="total"></span></div>
      <div class="strip" id="strip"></div>
    </div>

    <div class="ai" id="planBox" hidden></div>

    <div class="panel" id="panel"></div>

    <div class="panel">
      <label class="toggle"><input type="checkbox" id="badge"> 장면 위쪽에 '새로운뷰티' 로고 표시 (키네틱·스플릿)</label>
      <div class="note">글자는 화면 중간~위쪽에 들어가서 피드 썸네일과 하단 캡션에 가려지지 않아요. 음악은 인스타그램 업로드할 때 넣어주세요.</div>
    </div>

    <div class="panel result" id="result" hidden>
      <div class="label"><span>완성된 영상</span></div>
      <div class="row" style="align-items:flex-start">
        <video id="outVid" controls playsinline muted></video>
        <div style="display:grid;gap:8px;flex:1;min-width:160px">
          <button class="btn accent" id="saveBtn">앨범에 저장 · 공유</button>
          <div class="note" id="saveMsg"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="bar"><div class="bar-in">
  <button class="export" id="exportBtn"><div class="fill" id="fill"></div><span id="exportLabel">MP4로 만들기</span></button>
</div></div>

<input type="file" id="file" accept="image/*,video/*" class="sr-file" tabindex="-1" aria-hidden="true">

<script>
(()=>{
const W=720,H=1280,FPS=30,YEAR=new Date().getFullYear();
const C={cream:'#F6EFE3',ivory:'#FFF8EE',wood:'#4A3426',woodDeep:'#2E2018',sage:'#9CAF88',apricot:'#E8935A',apricotDeep:'#D9773F'};
const SANS='"Noto Sans KR","Apple SD Gothic Neo",sans-serif',SERIF='"Noto Serif KR","Apple SD Gothic Neo",serif',
  BODONI='"Bodoni Moda","Noto Serif KR",serif',ANTON='"Anton","Noto Sans KR",sans-serif',MONO='"IBM Plex Mono","Noto Sans KR",monospace',HAND='"Gaegu","Noto Sans KR",sans-serif';
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const tmp=document.createElement('canvas'),tctx=tmp.getContext('2d');
const BEAT=60/128;

/* ---------- styles ---------- */
const ST={
 kinetic:{no:1,name:'애플 키네틱 타이포그래피',en:'Apple Kinetic Type',len:15,rec:'15초 · 한 화면 한 메시지',
  desc:'크고 두꺼운 글자가 한 줄씩 올라오는 깔끔한 하드컷 영상이에요.',ex:'"아직도 살만 빼세요?" → 3D BODY RESET → 문의',
  hooks:['아직도 살만 빼세요?','이거 모르면 손해예요','왜 나만 안 빠질까?','40대부터 달라지는 몸','거울 보기 싫으셨죠?'],
  rule:'호기심·불안을 자극하는 후킹형. 큰 문구 1~2줄, 한 줄 10자 이내.',
  preset:[{main:'덜 먹는데\n왜 *안 빠질까*?',dur:2.5},{main:'살이 아니라\n*자세*가 찐 거예요',dur:3},{main:'*3D BODY RESET*',sub:'체형 균형부터 다시',dur:3.5},{main:'옆모습부터\n*달라져요*',dur:3},{main:'새로운뷰티',sub:'지금 문의주세요',note:'인천 연수구 · 네이버 예약',dur:3,kind:'cta'}]},
 cinema:{no:2,name:'넷플릭스 시네마틱',en:'Cinematic Trailer',len:15,rec:'15초 · 빛과 그림자, 슬로모션',
  desc:'영화 예고편처럼 어두운 화면, 빛 번짐, 느린 화면, 천천히 떠오르는 글자로 긴장감을 만들어요.',ex:'어두운 화면에 "오늘도 몸은 버텼습니다" → 관리실 장면',
  hooks:['오늘도 몸은 버텼습니다','쉬지 못한 근육은 기억합니다','당신의 몸이 보내는 마지막 신호'],
  rule:'영화 예고편 나레이션처럼 짧고 묵직한 문장. 마침표 톤. 큰 문구 1~2줄, 한 줄 12자 이내.',
  preset:[{main:'오늘도\n몸은 버텼습니다',dur:3.5},{main:'쉬지 못한 근육은\n*기억*합니다',dur:3,slow:true},{main:'이제는\n풀어줄 시간',dur:3,slow:true},{main:'*3D BODY RESET*',sub:'몸의 균형을 다시 쓰다',dur:2.5},{main:'새로운뷰티',sub:'지금 문의주세요',note:'인천 연수구 · 네이버 예약',dur:3,kind:'cta'}]},
 vogue:{no:3,name:'보그 매거진 에디토리얼',en:'Fashion Editorial Motion',len:12,rec:'12초 · 여백과 대형 타이틀',
  desc:'패션 화보처럼 여백을 두고 사진을 프레임에 담아, 큰 영문 타이틀과 짧은 한글 캡션을 얹어요.',ex:'관리 기기·공간·상담을 화보처럼 "THE ART OF BODY BALANCE"',

const BASE=`[샵 정보]
- 새로운뷰티: 인천 연수구 1인 뷰티샵. 에너지 테라피 관리, 슬로우에이징 철학.
- 대표 관리 프로그램: 3D BODY RESET (체형 균형·라인 관리). 이 이름은 여러 장면에 반복해도 됨.
- 고객층: 30~50대 여성. 살이 안 빠지는 고민, 체형 틀어짐, 붓기, 나이 들며 달라지는 몸, 만성 피로.

[공통 규칙]
- 인스타 릴스 9:16. 한 화면에 한 메시지만. 줄바꿈은 \\n. 가장 중요한 단어 하나만 *별표*로 감싸 강조(선택).
- 작은 문구(sub)는 없어도 됨. 있으면 16자 이내.
- 장면끼리 같은 질문이나 같은 대답을 반복하지 말 것. 3D BODY RESET 이름은 예외.
- "완치", "100%", "무조건 빠짐" 같은 과장·의료 효과 단정 표현 금지. 측정값·수치를 지어내지 말 것.
- 사진·영상에 실제로 보이는 내용(관리 장면, 기구, 공간, 몸 라인, 손동작 등)과 문구가 맞아야 함. 보이지 않는 것을 지어내지 말 것.

[후킹 패턴 — 요즘 릴스에서 많이 쓰는 방식]
- 부정형: 손해·실수를 짚음. 예) 이렇게 빼면 라인부터 무너져요 / 풀기만 하면 다시 뭉치는 이유
- 호기심형: 상식을 뒤집어 "왜?"를 만듦. 예) 살이 아니라 자세가 찐 거예요 / 덜 먹는데 왜 안 빠질까?
- 문제 제기형: 매일 겪는 고민을 질문으로. 예) 자고 일어나도 몸이 무거우세요?
- 비교형: A vs B. 예) 살 빼는 관리 vs 균형 잡는 관리
- 숫자형: 개수를 먼저. 예) 체형 무너지는 신호 3가지
- 결과 먼저형: 실제 변화 장면이 보일 때만.
- 고백형: 원장 본인 경험 — 사용자가 알려준 경우가 아니면 쓰지 말 것.
- 첫 장면은 부정형과 호기심형을 우선 섞어 쓰고, 이후 장면은 문제 공감 → 3D BODY RESET 해결 → 변화 기대 흐름으로.
- 각 추천의 why에는 어떤 패턴을 썼는지 적을 것.`;
const brief=()=>{const st=S();return `${BASE}

[영상 스타일] ${st.no}. ${st.name} (${st.en})
- 연출: ${st.desc}
- 예시 흐름: ${st.ex}
- 이 스타일 문구 규칙: ${st.rule}`};
function snap(m){return new Promise(res=>{const mi=mInfo(m);if(!mi)return res(null);
  const c=document.createElement('canvas');c.width=540;c.height=960;const x=c.getContext('2d');const k=Math.max(540/mi.sw,960/mi.sh);x.drawImage(mi.el,(540-mi.sw*k)/2,(960-mi.sh*k)/2,mi.sw*k,mi.sh*k);c.toBlob(b=>res(b),'image/jpeg',.85)})}
const plain=s=>(s.main||'').replace(/\n/g,' / ');
const hl=t=>esc(t).replace(/\*([^*]+)\*/g,'<em>$1</em>');
const unN=x=>String(x).replace(/\\n/g,'\n');
function errCopy(c){return({not_granted:'Claude 사용을 허용하지 않아 추천을 쓸 수 없어요.',sampling_disabled:'이 계정에서는 추천 기능을 쓸 수 없어요.',rate_limited:'요청이 많아요. 잠시 후 다시 눌러주세요.',image_rejected:'이 사진은 읽지 못했어요. 다른 사진으로 바꿔보세요.',invalid_json:'추천을 정리하지 못했어요. 다시 눌러주세요.',session_expired:'다시 로그인한 뒤 눌러주세요.',refused:'이 내용으로는 추천을 만들지 못했어요.'})[c]||'추천을 받지 못했어요. 다시 눌러주세요.'}
function renderAI(){
  const box=panel.querySelector('#aiBox');if(!box)return;const s=scenes[sel];
  if(!ai){box.innerHTML='';return}
  const st=sugs[s.id];const busy=aiBusy&&aiBusy.kind==='scene'&&aiBusy.id===s.id;
  const label=s.media?(s.kind==='cta'?'✨ 이 화면에 맞는 문의 문구 추천':'✨ 이 사진·영상에 맞는 문구 추천'):'✨ 문구 추천 (사진을 넣으면 더 정확해요)';
  box.innerHTML=`<div class="ai">
    <div class="row"><button class="ai-btn" id="aiGo" ${aiBusy?'disabled':''}>${label}</button>${busy?'<button class="btn sm" id="aiStop">멈추기</button>':''}</div>
    ${busy?`<div class="thinking"><span class="dot"></span>${esc(S().name)} 스타일로 문구를 고르는 중이에요 (10~30초)</div>`:''}
    ${st&&st.err?`<div class="note">${esc(st.err)}</div>`:''}
    ${st&&st.list?`<div class="sugs">${st.list.map((o,k)=>`<button class="sug" data-k="${k}"><b>${hl(o.main)}</b>${o.sub?`<span>${esc(o.sub)}</span>`:''}${o.why?`<small>${esc(o.why)}</small>`:''}</button>`).join('')}</div><div class="note">눌러서 바로 적용하세요. 적용 후에도 직접 고칠 수 있어요.</div>`:''}
  </div>`;
  box.querySelector('#aiGo').onclick=()=>suggestScene(sel);
  const stop=box.querySelector('#aiStop');stop&&(stop.onclick=()=>aiBusy&&aiBusy.ctl.abort());
  box.querySelectorAll('.sug').forEach(b=>b.onclick=()=>{const o=st.list[+b.dataset.k];s.main=o.main;s.sub=o.sub||'';save();queueFonts();selectScene(sel)});
}
async function suggestScene(i){
  const s=scenes[i];if(aiBusy)return;const ctl=new AbortController();aiBusy={kind:'scene',id:s.id,ctl};sugs[s.id]={};renderAI();renderPlan();
  const others=scenes.map((x,k)=>k===i?null:`${k+1}번 장면: ${plain(x)}${x.sub?' / '+x.sub:''}`).filter(Boolean).join('\n');
  const pos=s.kind==='cta'?'마지막 문의(CTA) 장면. main은 샵 이름 또는 짧은 마무리, sub는 "문의주세요"처럼 행동을 부르는 버튼 문구.':i===0?'첫 장면(후킹). 1초 안에 스크롤을 멈추게.':`${i+1}번째 장면 (전체 ${scenes.length}개 중).`;
  const imgs=[];if(aiImg){const a=await snap(resolved(i).m);if(a)imgs.push(a);if(S().split&&imgs.length<aiMax){const b=await snap(s.media2);if(b)imgs.push(b)}}
  const prompt=`${brief()}

[지금 만들 장면] ${pos}
${imgs.length?(S().split&&imgs.length>1?'첨부 이미지 1번은 위 화면, 2번은 아래 화면이에요.':'첨부 이미지는 이 장면에 들어갈 사진(영상이면 한 프레임)이에요.')+' 보이는 내용에 맞춰 써주세요.':'이미지는 없어요. 앞뒤 장면 흐름에 맞춰 써주세요.'}
현재 문구: ${plain(s)||'(없음)'}${s.sub?' / '+s.sub:''}

[다른 장면 문구 — 겹치지 않게]
${others||'(없음)'}

이 스타일에 맞는 서로 다른 후보 3개를 주세요. 다른 텍스트 없이 JSON 배열만:
[{"main":"첫 줄\\n둘째 줄","sub":"","why":"이 문구를 고른 이유 한 줄"}]`;
  try{const r=await ai.json(prompt,{signal:ctl.signal,cache:false,...(imgs.length?{images:imgs}:{})});
    const list=(Array.isArray(r)?r:[]).filter(o=>o&&typeof o.main==='string'&&o.main.trim()).slice(0,4).map(o=>({main:unN(o.main),sub:o.sub?String(o.sub):'',why:o.why?String(o.why):''}));
    sugs[s.id]=list.length?{list}:{err:'추천을 정리하지 못했어요. 다시 눌러주세요.'};
  }catch(e){sugs[s.id]=e&&e.code==='cancelled'?{}:{err:errCopy(e&&e.code)};if(e&&['not_granted','sampling_disabled'].includes(e.code))ai=null}
  aiBusy=null;renderAI();renderPlan();
}
const planBox=document.getElementById('planBox');
function renderPlan(){
  if(!ai){planBox.hidden=true;return}planBox.hidden=false;
  const busy=aiBusy&&aiBusy.kind==='plan';const n=scenes.filter(s=>s.media).length;
  planBox.innerHTML=`<div class="label" style="color:inherit"><span>전체 추천 · ${esc(S().name)}</span></div>
    <div class="note">넣은 사진·영상을 모두 보고 이 스타일에 맞게 장면 순서와 문구를 한 번에 짜드려요.${n?'':' 먼저 장면에 사진·영상을 넣어주세요.'}</div>
    <div class="row"><button class="ai-btn" id="planGo" ${aiBusy||!n?'disabled':''}>✨ 순서·문구 전체 추천</button>${busy?'<button class="btn sm" id="planStop">멈추기</button>':''}</div>
    ${busy?'<div class="thinking"><span class="dot"></span>장면 전체를 보고 흐름을 짜는 중이에요 (20~60초)</div>':''}
    ${planErr?`<div class="note">${esc(planErr)}</div>`:''}
    ${plan?`<ol class="plan-list">${plan.items.map(it=>`<li><b>${hl(it.main)}</b>${it.sub?` · ${esc(it.sub)}`:''} <small class="note">(${it.from}번 장면 사용)</small></li>`).join('')}</ol>
      ${plan.why?`<div class="note">${esc(plan.why)}</div>`:''}
      <div class="row"><button class="btn accent" id="planApply">이대로 적용</button><button class="btn sm" id="planClose">닫기</button></div>`:''}`;
  const q=id=>planBox.querySelector('#'+id);
  q('planGo').onclick=suggestPlan;q('planStop')&&(q('planStop').onclick=()=>aiBusy&&aiBusy.ctl.abort());
  q('planClose')&&(q('planClose').onclick=()=>{plan=null;renderPlan()});
  q('planApply')&&(q('planApply').onclick=applyPlan);
}
async function suggestPlan(){
  if(aiBusy)return;const ctl=new AbortController();aiBusy={kind:'plan',ctl};plan=null;planErr='';renderPlan();renderAI();
  const body=scenes.map((s,k)=>({s,k})).filter(x=>x.s.kind!=='cta');
  const imgs=[],desc=[];
  for(const {s,k} of body){let b=null;if(aiImg&&imgs.length<aiMax)b=await snap(s.media);if(b)imgs.push(b);desc.push(`장면${k+1}: ${b?`첨부 이미지 ${imgs.length}번째`:'이미지 없음'} / 현재 문구 "${plain(s)}"`)}
  const prompt=`${brief()}

[장면 목록] 마지막 문의(CTA) 장면은 따로 고정이라 아래에는 없어요.
${desc.join('\n')}

할 일:
1) 이미지들을 보고 이 스타일의 예시 흐름처럼 가장 끌리는 순서로 장면을 정해주세요.
2) 정한 순서대로 각 장면 문구를 이 스타일 규칙에 맞게 써주세요. 장면끼리 겹치는 질문·대답 금지.
3) 마지막 문의 장면의 sub(버튼 문구)도 하나 정해주세요.
모든 장면(${body.length}개)을 빠짐없이 한 번씩 써야 해요. 다른 텍스트 없이 JSON만:
{"items":[{"scene":3,"main":"첫 줄\\n둘째 줄","sub":""}],"ctaSub":"지금 문의주세요","why":"이 순서로 짠 이유 한 줄"}`;
  try{const r=await ai.json(prompt,{signal:ctl.signal,cache:false,...(imgs.length?{images:imgs}:{})});
    const valid=new Set(body.map(x=>x.k+1)),seen=new Set();
    const items=(r&&Array.isArray(r.items)?r.items:[]).filter(it=>it&&valid.has(+it.scene)&&!seen.has(+it.scene)&&seen.add(+it.scene)&&typeof it.main==='string')
      .map(it=>({from:+it.scene,id:scenes[+it.scene-1].id,main:unN(it.main),sub:it.sub?String(it.sub):''}));
    body.forEach(x=>{if(!seen.has(x.k+1))items.push({from:x.k+1,id:x.s.id,main:x.s.main,sub:x.s.sub})});
    plan={items,ctaSub:r&&r.ctaSub?String(r.ctaSub):'',why:r&&r.why?String(r.why):''};
  }catch(e){planErr=e&&e.code==='cancelled'?'':errCopy(e&&e.code);if(e&&['not_granted','sampling_disabled'].includes(e.code))ai=null}
  aiBusy=null;renderUI();
}
function applyPlan(){
  if(!plan)return;const byId=Object.fromEntries(scenes.map(s=>[s.id,s]));const cta=scenes.filter(s=>s.kind==='cta');
  const ordered=plan.items.map(it=>{const s=byId[it.id];s.main=it.main;s.sub=it.sub;return s}).filter(Boolean);
  if(plan.ctaSub&&cta[0])cta[0].sub=plan.ctaSub;
  scenes.splice(0,scenes.length,...ordered,...cta);plan=null;save();queueFonts();selectScene(0);
}
(async()=>{try{const s=window.claude&&window.claude.use?await window.claude.use('sample'):null;if(!s)return;ai=s;
  const lim=await s.limits().catch(()=>null);aiImg=!!(lim&&lim.images);aiMax=lim&&lim.images?lim.images.maxCount:1;renderPlan();renderAI()}catch(e){}})();

/* ---------- export ---------- */
const exportBtn=document.getElementById('exportBtn'),fill_=document.getElementById('fill'),exportLabel=document.getElementById('exportLabel');
const resultEl=document.getElementById('result'),outVid=document.getElementById('outVid'),saveBtn=document.getElementById('saveBtn'),saveMsg=document.getElementById('saveMsg');
let rec=null,chunks=[],outBlob=null,outExt='mp4';
function pickMime(){const list=['video/mp4;codecs=avc1.42E01F','video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'];
  if(!window.MediaRecorder)return null;for(const m of list){try{if(MediaRecorder.isTypeSupported(m))return m}catch(e){}}return ''}
exportBtn.onclick=async()=>{
  if(exporting)return;
  const mime=pickMime();
  if(mime===null||!cv.captureStream){exportLabel.textContent='이 브라우저에선 저장이 안 돼요. 크롬이나 사파리 최신 버전에서 열어주세요';return}
  exportLabel.textContent='글꼴 준비 중…';await loadFonts();
  setPlaying(false);t=0;curScene=-1;selBlur=-1;
  const v0=vids(scenes[0]);
  await Promise.all(v0.map(v=>new Promise(r=>{let done=false;const f=()=>{if(!done){done=true;r()}};v.addEventListener('seeked',f,{once:true});try{v.currentTime=0}catch(e){f()}setTimeout(f,800)})));
  const stream=cv.captureStream(FPS);chunks=[];
  try{rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:8e6}:{videoBitsPerSecond:8e6})}catch(e){rec=new MediaRecorder(stream)}
  outExt=(rec.mimeType||mime||'').includes('mp4')?'mp4':'webm';
  rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  rec.onstop=()=>{outBlob=new Blob(chunks,{type:rec.mimeType||('video/'+outExt)});outVid.src=URL.createObjectURL(outBlob);resultEl.hidden=false;
    saveMsg.textContent=outExt==='mp4'?'인스타그램에 바로 올릴 수 있는 MP4예요.':'이 브라우저는 WebM으로만 만들 수 있어요. 휴대폰(사파리·크롬)에서 만들면 MP4로 나와요.';
    exportLabel.textContent='다시 만들기';fill_.style.width='0';exporting=false;exportBtn.disabled=false;renderUI();resultEl.scrollIntoView({behavior:'smooth',block:'nearest'})};
  exporting=true;exportBtn.disabled=true;exportLabel.textContent='영상 만드는 중… 화면을 켜 두세요';
  rec.start(250);last=performance.now();setPlaying(true);
};
function finishExport(){setPlaying(false);setTimeout(()=>{rec&&rec.state!=='inactive'&&rec.stop()},150)}
saveBtn.onclick=async()=>{
  if(!outBlob)return;const name=`새로운뷰티_${S().en.split(' ')[0]}_${new Date().toISOString().slice(0,10)}.${outExt}`;
  const file=new File([outBlob],name,{type:outBlob.type||('video/'+outExt)});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});saveMsg.textContent='저장했어요. 아이폰은 공유 창에서 "비디오 저장"을 누르면 사진 앱에 들어가요.';return}}
  catch(e){if(e&&e.name==='AbortError'){saveMsg.textContent='저장을 취소했어요.';return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();
  saveMsg.textContent='다운로드 폴더에 저장했어요. 갤러리나 파일 앱에서 확인하세요.';
};

/* ---------- install prompt ---------- */
(()=>{const box=document.getElementById('install'),how=document.getElementById('installHow'),btn=document.getElementById('installBtn');
  const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;let dismissed=false;try{dismissed=localStorage.getItem('nb-install-x')==='1'}catch(e){}
  if(standalone||dismissed)return;
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  how.textContent=ios?'사파리 아래쪽 공유 버튼(□↑)을 누르고 "홈 화면에 추가"를 누르세요.':'크롬 오른쪽 위 ⋮ 메뉴에서 "앱 설치" 또는 "홈 화면에 추가"를 누르세요.';box.hidden=false;
  let ev=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();ev=e;btn.hidden=false;how.textContent='아래 버튼을 누르면 바로 설치돼요.'});
  btn.onclick=async()=>{if(!ev)return;ev.prompt();const r=await ev.userChoice.catch(()=>null);if(r&&r.outcome==='accepted')box.hidden=true;ev=null};
  document.getElementById('installClose').onclick=()=>{box.hidden=true;try{localStorage.setItem('nb-install-x','1')}catch(e){}};
  addEventListener('appinstalled',()=>{box.hidden=true});
})();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});

fontMode=fontModeSaved;fontSeg.querySelectorAll('button').forEach(b=>b.onclick=()=>{fontMode=b.dataset.f;lastKey='';save();queueFonts();renderStyles()});
renderStyles();renderUI();t=Math.min(1.6,scenes[0].dur-0.05);loadFonts();restoreMedia();
requestAnimationFrame(n=>{last=n;frame(n)});
})();
